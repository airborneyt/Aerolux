name: 'Aerolux 2.0.0-alpha.3'

on:
  push:
    branches:
      - main

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Builds macOS .dmg (Universal)
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest' # Builds Windows .exe and .msi
            args: ''
          - platform: 'ubuntu-22.04' # Builds Linux .deb and .AppImage
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Installs both Intel and Apple Silicon targets if on a Mac runner
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev


      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: Aerolux-v2.0.0-alpha.4
          releaseName: 'Aerolux v2.0.0-alpha.4'
          releaseBody: 'Download your app for Windows, macOS, or Linux.'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
